<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato - Bastidores do Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--card:#18181b;--border:#27272a;--text:#fafafa;--text-muted:#a1a1aa;--text-dim:#71717a;--accent:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.container{max-width:800px;margin:0 auto;padding:0 24px}
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(9,9,11,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 0}
.nav .container{display:flex;align-items:center;max-width:1280px}
.nav-brand{font-weight:800;font-size:1.1rem}
.nav-brand span{color:var(--accent)}
.nav-brand a{text-decoration:none;color:inherit}
.content{padding:100px 0 60px;text-align:center}
h1{font-size:2rem;font-weight:800;margin-bottom:8px}
.subtitle{color:var(--text-muted);margin-bottom:40px}
.contact-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:500px;margin:0 auto}
.contact-card p{color:var(--text-muted);margin-bottom:20px}
.email-link{display:inline-block;padding:12px 32px;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;font-weight:600;font-size:1rem;transition:opacity .2s}
.email-link:hover{opacity:.85}
.footer{border-top:1px solid var(--border);padding:24px 0;text-align:center;color:var(--text-dim);font-size:.85rem;margin-top:60px}
a{color:var(--accent)}
</style>
</head>
<body>
<nav class="nav"><div class="container">
  <div class="nav-brand"><a href="index.html"><span>Bastidores</span> do Sistema</a></div>
</div></nav>
<div class="content"><div class="container">
  <h1>Contato</h1>
  <p class="subtitle">Entre em contato para dúvidas, correções ou sugestões</p>
  <div class="contact-card">
    <p>Se você encontrou algum erro nas informações, deseja sugerir uma correção ou tem dúvidas sobre o conteúdo deste site, entre em contato:</p>
    <a class="email-link" href="mailto:manutencaopredialricardo@gmail.com">Enviar e-mail</a>
  </div>
</div></div>
<div class="footer"><div class="container">
  <p><a href="index.html">← Voltar ao site</a></p>
</div></div>
</body>
</html>
